name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Valores falsos: o build só precisa das variáveis públicas do Supabase
    # existirem; nenhum segredo é usado nem exposto no CI.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # O build gera os tipos de rota (PageProps etc.) que o tsc precisa,
      # por isso o tsc roda depois dele.
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Smoke HTTP do build com configuracao sintetica
        run: node scripts/smoke-public.mjs

  checkout-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar PostgreSQL 17 nativo (sem Docker)
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/postgres ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-17
          fi
      - name: Validar migrations e checkout com dados sinteticos
        run: node scripts/checkout-lab/run.mjs
